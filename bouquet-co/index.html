  .b-box::before { content: ""; position: absolute; inset: -18px; border: 1px solid var(--accent); border-radius: 999px 999px 10px 10px; z-index: -1; }
  .b-tag { position: absolute; left: -36px; bottom: 54px; background: var(--surface); padding: 18px 22px; box-shadow: 0 30px 60px -30px rgba(15,60,55,.5); font-size: 14px; color: var(--muted); }

  .ribbon { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; overflow: visible; }
  .ribbon path { fill: none; stroke: var(--accent); stroke-linecap: round; stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 2.6s var(--ease) .3s forwards; }
  .ribbon .r2 { stroke-width: 1.2; opacity: .55; animation-delay: .5s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  /* telefon lenti: şəklin altında çəkilir və fiyonkla bağlanır */
  .ribbon-m { display: none; position: absolute; left: -16px; right: -16px; bottom: -46px; width: calc(100% + 32px); height: auto; overflow: visible; pointer-events: none; }
  .ribbon-m path { fill: none; stroke: var(--accent); stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .ribbon-m .band { stroke-width: 3; animation: draw 1.4s var(--ease) .35s forwards; }
  .ribbon-m .b2 { stroke-width: 1.2; opacity: .5; animation-delay: .5s; }
  .ribbon-m .loop { stroke-width: 3; animation: draw .7s var(--ease) 1.45s forwards; }
  .ribbon-m .tail { stroke-width: 2.4; animation: draw .5s var(--ease) 1.95s forwards; }
  .ribbon-m .knot { fill: var(--accent); transform-box: fill-box; transform-origin: center; transform: scale(0); animation: knot .45s var(--ease) 1.85s forwards; }
  @keyframes knot { 60% { transform: scale(1.4); } to { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .ribbon path, .ribbon-m path { stroke-dashoffset: 0; animation: none; } .ribbon-m .knot { transform: none; animation: none; } }

  .cat-img { background: var(--accent); box-shadow: inset 0 0 0 6px var(--bg), 0 0 0 1px var(--line-strong); }

    .b-store-in { grid-template-columns: 1fr; } .b-store img { aspect-ratio: 4/3; }

</style>
