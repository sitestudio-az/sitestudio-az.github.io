<style>
  :root {
    --bg: #FAF6EF; --surface: #FFFFFF; --soft: #F1E8D8; --ink: #2B1E16; --muted: #7A6B5C;
    --line: #EEE3D1; --line-strong: #DFCDAE; --sale: #B3122B; --ok: #3C9A62;
    --accent: #7A1E2C; --accent-ink: #FFF8EC; --accent-text: #8F6B2E;
    --hi: #B08D57; --hi2: #E5CFA4;
    --f-head: 'Cormorant Garamond', Georgia, serif; --f-body: 'Manrope', system-ui, sans-serif; --f-label: 'Manrope', sans-serif;
    --w-head: 500; --ls-head: -.02em;
    --r-card: 14px; --r-btn: 40px; --r-img: 14px; --r-big: 26px;
    --hdr-bg: rgba(250,246,239,.9); --demo-bg: #2B1E16;
    --finale-bg: #2B1E16; --finale-ink: #FAF6EF; --finale-accent: #B08D57; --finale-btn: #B08D57; --finale-btn-ink: #2B1E16;
    --card-shadow: 0 34px 70px -40px rgba(43,30,22,.45);
  }
  .eyebrow, .pcat, .nav, .ftr h3, .filters legend, .sizes legend { font-family: var(--f-label); letter-spacing: .22em; }
  .eyebrow { color: var(--hi); }
  h1 em, h2 em { font-style: italic; color: var(--accent-text); }
  .sec-head h2 { font-size: clamp(36px, 4.8vw, 70px); line-height: 1.02; }
  .btn { font-family: var(--f-label); letter-spacing: .1em; text-transform: uppercase; font-size: 12px; }
  .chip.on, .cat-pills button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .pbadge-bestseller { background: var(--hi); color: #2B1E16; }
  .azn { font-family: var(--f-body); font-weight: 400; font-size: .62em; margin-left: .06em; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .x-logo { display: grid; line-height: 1; color: var(--ink); text-align: left; }
  .x-logo b { font-family: var(--f-head); font-weight: 600; font-size: 28px; letter-spacing: .03em;  }
  .x-logo small { font-family: var(--f-label); font-size: 9px; letter-spacing: .5em; text-transform: uppercase; color: var(--muted); margin-top: 5px; }
  .cats { --cat-cols: 6; }
  .cat-img { border-radius: 999px 999px 14px 14px; aspect-ratio: 3/4; }
  .about-media img { border-radius: 20px; }
  .finale-card { border-radius: var(--r-big); }

  /* ===== HERO variants ===== */
  .xh { position: relative; overflow: hidden; isolation: isolate; }
  .xh .lead { max-width: 44ch; font-size: 18px; color: var(--muted); }
  .xh h1 { font-weight: var(--w-head); letter-spacing: -.03em; }
  .xh h1 .w { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: .08em; }
  .xh h1 .w > span { display: inline-block; transform: translateY(108%); animation: xr 1.15s var(--ease) forwards; animation-delay: calc(.2s + var(--i) * 95ms); }
  @keyframes xr { to { transform: none; } }
  .xh .fx { opacity: 0; animation: xf .9s var(--ease) forwards; animation-delay: var(--d, 1s); }
  @keyframes xf { to { opacity: 1; } }
  .xh-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
  .xh-facts { display: flex; flex-wrap: wrap; gap: clamp(20px, 3vw, 44px); margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line-strong); font-size: 13px; color: var(--muted); }
  .xh-facts b { display: block; font-family: var(--f-head); font-weight: var(--w-head); font-size: 30px; color: var(--ink); line-height: 1.05; font-variant-numeric: lining-nums; }
  .xh video, .xh .vimg { width: 100%; height: 100%; object-fit: cover; display: block; }
  .xh-tag { position: absolute; z-index: 3; display: grid; gap: 2px; padding: 14px 18px; border-radius: 16px; background: rgba(255,255,255,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 13px; color: var(--muted); box-shadow: 0 24px 50px -28px rgba(0,0,0,.6); transition: transform .4s var(--ease); }
  .xh-tag i { font-style: normal; font-family: var(--f-label); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--hi); }
  .xh-tag span { color: var(--ink); font-weight: 600; }
  .xh-tag b { font-family: var(--f-head); font-weight: 500; font-size: 28px; color: var(--accent-text); line-height: 1.05; }
  @media (hover: hover) { .xh-tag:hover { transform: translateY(-4px); } }
  .xh-in { max-width: 1440px; margin: 0 auto; padding: clamp(28px, 5vh, 60px) var(--pad) clamp(44px, 7vh, 80px); display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(30px, 5vw, 90px); align-items: center; min-height: calc(100svh - 120px); }
  .xh h1 { font-size: clamp(48px, 5.8vw, 100px); line-height: .98; margin: 16px 0 24px; }
  .xh h1 em .w { padding-right: .18em; margin-right: -.12em; }
  /* arch */
  .xh-arch .media { position: relative; justify-self: center; width: min(100%, 440px, calc((100svh - 240px) * .6)); }
  .xh-arch .frame { position: relative; aspect-ratio: 9/15; border-radius: 240px 240px 14px 14px; overflow: hidden; background: var(--soft) center / cover; box-shadow: 0 60px 100px -50px rgba(43,30,22,.45); opacity: 0; transform: translateY(30px); animation: xu 1.4s var(--ease) .3s forwards; }
  @keyframes xu { to { opacity: 1; transform: none; } }
  .xh-arch .media::before { content: ""; position: absolute; inset: -16px; border: 1px solid var(--hi); opacity: .5; border-radius: 256px 256px 22px 22px; }
  .xh-arch .xh-tag { left: -60px; bottom: 46px; }
  .xh-blob { position: absolute; z-index: -1; border-radius: 50%; filter: blur(70px); opacity: .5; animation: xd 16s ease-in-out infinite alternate; }
  .xh-blob.b1 { width: 46vw; height: 46vw; left: -12vw; top: -14vw; background: var(--hi); opacity: .22; }
  .xh-blob.b2 { width: 36vw; height: 36vw; right: -8vw; bottom: -12vw; background: var(--hi2); opacity: .22; animation-delay: -6s; }
  @keyframes xd { to { transform: translate(6vw, 4vw) scale(1.12); } }
  /* full-bleed */
  .xh-full { height: 100svh; min-height: 620px; color: #F7F3EE; background: #0B0B0E; }
  .xh-full .bg { position: absolute; inset: 0; z-index: -2; }
  .xh-full .bg video, .xh-full .bg .vimg { transform: scale(1.12); animation: xs 3.2s var(--ease) forwards; }
  @keyframes xs { to { transform: scale(1.03); } }
  .xh-full::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(8,8,10,.55), rgba(8,8,10,.1) 28%, rgba(8,8,10,.45) 55%, rgba(8,8,10,.95)), radial-gradient(90% 70% at 15% 75%, rgba(8,8,10,.65), transparent 70%); }
  .xh-full h1 em { color: #FFFFFF; } .xh-full .eyebrow { color: #fff; opacity: .85; }
  .xh-full .in { position: absolute; left: 0; right: 0; bottom: 0; max-width: 1440px; margin: 0 auto; padding: 0 var(--pad) clamp(36px, 6vh, 70px); }
  .xh-full h1 { color: #F7F3EE; font-size: clamp(56px, 8vw, 140px); }
  .xh-full .lead { color: #DCD5CC; }
  .xh-full .xh-facts { border-top-color: rgba(255,255,255,.25); color: #CFC7BD; } .xh-full .xh-facts b { color: #fff; }
  .xh-full .btn-ghost { color: #fff; border-color: rgba(255,255,255,.45); background: rgba(0,0,0,.2); }
  .xh-full .xh-tag { right: var(--pad); bottom: clamp(36px, 6vh, 70px); }
  body[data-page="home"].xfull .hdr { background: linear-gradient(180deg, rgba(8,8,10,.6), rgba(8,8,10,0)); border-bottom-color: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; transition: background .4s; }
  body[data-page="home"].xfull .hdr .logo, body[data-page="home"].xfull .hdr .nav a, body[data-page="home"].xfull .hdr .icon-btn, body[data-page="home"].xfull .hdr .x-logo, body[data-page="home"].xfull .hdr .x-logo small { color: #fff; }
  body[data-page="home"].xfull.scrolled .hdr { background: var(--hdr-bg); border-bottom-color: var(--line); }
  body[data-page="home"].xfull.scrolled .hdr .logo, body[data-page="home"].xfull.scrolled .hdr .nav a, body[data-page="home"].xfull.scrolled .hdr .icon-btn, body[data-page="home"].xfull.scrolled .hdr .x-logo { color: var(--ink); }
  body[data-page="home"].xfull.scrolled .hdr .x-logo small { color: var(--muted); }
  body[data-page="home"].xfull:not(.scrolled) .hdr .x-logo [style] { color: #fff !important; }
  /* tilt cards */
  .xh-tilt .media { position: relative; justify-self: center; width: min(100%, 400px, calc((100svh - 280px) * .58)); }
  .xh-tilt .card { position: relative; aspect-ratio: 9/15; border-radius: 30px; overflow: hidden; background: var(--soft) center / cover; box-shadow: 0 50px 90px -40px rgba(0,0,0,.6); transform: rotate(3deg); opacity: 0; animation: xt 1.3s var(--ease) .25s forwards; }
  @keyframes xt { from { opacity: 0; transform: rotate(9deg) translateY(60px); } to { opacity: 1; transform: rotate(3deg); } }
  .xh-tilt .mini { position: absolute; left: -28%; bottom: 8%; width: 46%; aspect-ratio: 3/4; border-radius: 20px; overflow: hidden; border: 5px solid var(--bg); background: var(--soft) center / cover; transform: rotate(-7deg); box-shadow: 0 30px 60px -30px rgba(0,0,0,.7); opacity: 0; animation: xm 1.3s var(--ease) .6s forwards; }
  .xh-tilt .mini2 { left: auto; right: -22%; bottom: auto; top: 6%; width: 38%; transform: rotate(8deg); animation-name: xm2; animation-delay: .8s; }
  @keyframes xm { from { opacity: 0; transform: rotate(-16deg) translateX(-40px); } to { opacity: 1; transform: rotate(-7deg); } }
  @keyframes xm2 { from { opacity: 0; transform: rotate(16deg) translateX(40px); } to { opacity: 1; transform: rotate(8deg); } }
  .xh-tilt .mini img { width: 100%; height: 100%; object-fit: cover; }
  .xh-tilt .xh-tag { right: -30px; bottom: 30px; }
  /* mosaic (photo stack crossfade) */
  .xh-mosaic .media { position: relative; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 14px; height: min(calc(100svh - 230px), 680px); }
  .xh-mosaic .tile { position: relative; border-radius: 14px; overflow: hidden; background: var(--soft); opacity: 0; transform: translateY(30px); animation: xu 1.2s var(--ease) forwards; }
  .xh-mosaic .tile:nth-child(1) { grid-row: 1 / 3; animation-delay: .2s; } .xh-mosaic .tile:nth-child(2) { animation-delay: .4s; } .xh-mosaic .tile:nth-child(3) { animation-delay: .6s; }
  .xh-mosaic .tile img, .xh-mosaic .tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 1.4s ease, transform 7s linear; }
  .xh-mosaic .tile img.off { opacity: 0; } .xh-mosaic .tile img.on { transform: scale(1.08); }
  .xh-mosaic .xh-tag { left: -40px; bottom: 30px; }
  /* dark split: blurred ambient + arch */
  .xh-amb { background: #0B0A0C; color: #F4EFE8; }
  .xh-amb .amb { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; transform: scale(1.25); filter: blur(42px) brightness(.45) saturate(1.3); }
  .xh-amb h1 { color: #F4EFE8; } .xh-amb .lead { color: #CFC6BB; } .xh-amb .xh-facts { color: #B9B0A5; border-top-color: rgba(255,255,255,.18); } .xh-amb .xh-facts b { color: #fff; }
  .xh-amb .btn-ghost { color: #fff; border-color: rgba(255,255,255,.4); }
  .xh-amb .media { position: relative; justify-self: center; width: min(100%, 430px, calc((100svh - 240px) * .58)); }
  .xh-amb .frame { aspect-ratio: 9/15; border-radius: 240px 240px 8px 8px; overflow: hidden; background: #222 center / cover; box-shadow: 0 70px 120px -40px rgba(0,0,0,.95); opacity: 0; transform: translateY(30px); animation: xu 1.4s var(--ease) .4s forwards; }
  .xh-amb .media::before { content: ""; position: absolute; inset: -18px; border: 1px solid var(--hi); opacity: .55; border-radius: 999px 999px 14px 14px; }
  .xh-amb .xh-tag { left: -56px; bottom: 50px; }

  .marq { overflow: hidden; border-block: 1px solid var(--line-strong); background: var(--surface); }
  .marq div { display: flex; width: max-content; animation: xmq 36s linear infinite; }
  .marq span { font-family: var(--f-head); font-style: italic; font-size: clamp(20px, 2.3vw, 30px); padding: 15px 0; white-space: nowrap; color: var(--ink); }
  .marq span::after { content: "✦"; font-style: normal; font-size: .5em; color: var(--hi); margin: 0 32px; vertical-align: middle; }
  @keyframes xmq { to { transform: translateX(-50%); } }

  /* ===== SIGNATURES ===== */
  .reels { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: clamp(16px, 3vw, 36px); }
  .reel { position: relative; display: block; border-radius: 24px; overflow: hidden; aspect-ratio: 9/16; background: var(--soft) center / cover; box-shadow: var(--card-shadow); }
  .reel:nth-child(2) { margin-top: 56px; }
  .reel video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .reel-cap { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 13px 15px; border-radius: 16px; background: rgba(255,255,255,.9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; color: var(--ink); font-weight: 600; font-size: 14px; }
  .reel-cap b { font-family: var(--f-head); font-weight: 500; font-size: 22px; color: var(--accent-text); white-space: nowrap; }
  /* tiers: price-range chips that filter a live grid */
  .tiers-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 28px; }
  .tiers-bar button { padding: 12px 18px; border-radius: 40px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font: 600 15px var(--f-body); cursor: pointer; transition: background .2s, color .2s, border-color .2s, transform .2s var(--ease); font-variant-numeric: tabular-nums; }
  .tiers-bar button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  @media (hover: hover) { .tiers-bar button:hover { transform: translateY(-2px); } }
  .tiers-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; min-height: 200px; }
  .tiers-grid .pcard { animation: xu .6s var(--ease) both; }
  .tiers-note { margin-top: 18px; color: var(--muted); font-size: 14px; }
  /* budget slider */
  .budget { display: grid; grid-template-columns: .8fr 1.2fr; gap: clamp(24px, 4vw, 60px); align-items: start; }
  .budget-ctl { position: sticky; top: 110px; padding: 30px; border-radius: var(--r-big); background: var(--surface); border: 1px solid var(--line); }
  .budget-ctl output { display: block; font-family: var(--f-head); font-size: clamp(52px, 6vw, 86px); line-height: 1; color: var(--accent-text); font-variant-numeric: tabular-nums lining-nums; margin: 10px 0 18px; }
  .budget-ctl input[type=range] { width: 100%; accent-color: var(--accent); }
  .budget-ctl p { color: var(--muted); font-size: 14px; margin: 14px 0 0; }
  .budget-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  /* message on wrap */
  .msg { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(30px, 5vw, 80px); align-items: center; padding: clamp(24px, 4vw, 56px); border-radius: var(--r-big); background: var(--surface); border: 1px solid var(--line-strong); }
  .msg-prev { position: relative; aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: url() center / cover; box-shadow: 0 40px 90px -30px rgba(0,0,0,.6); display: grid; place-items: center; }
  .msg-prev::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,255,255,.08), rgba(255,255,255,.28)); }
  .msg-text { position: relative; max-width: 78%; text-align: center; font-family: 'Great Vibes', cursive; font-size: clamp(40px, 6vw, 74px); line-height: 1.05; color: #fff; text-shadow: 0 2px 2px rgba(0,0,0,.35), 0 0 22px rgba(255,255,255,.45); transform: rotate(-6deg); word-break: break-word; }
  .msg-form { display: grid; gap: 20px; }
  .msg-form label > span, .msg-form legend { display: block; font-family: var(--f-label); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .msg-form input[type=text] { width: 100%; padding: 16px 18px; font: 500 18px var(--f-body); border-radius: 14px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink); }
  .seg { display: flex; flex-wrap: wrap; gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
  .seg label { position: relative; } .seg input { position: absolute; opacity: 0; }
  .seg span { display: block; padding: 11px 17px; border-radius: 40px; border: 1.5px solid var(--line-strong); cursor: pointer; font-weight: 600; font-size: 14px; transition: background .2s, color .2s, border-color .2s; }
  .seg span small { font-weight: 400; opacity: .7; margin-left: 4px; }
  .seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .seg input:focus-visible + span { outline: 2px solid var(--hi); outline-offset: 2px; }
  .sum { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 26px; padding-top: 18px; border-top: 1px solid var(--line-strong); }
  .sum b { font-family: var(--f-head); font-size: clamp(36px, 4vw, 54px); font-weight: 500; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .sum small { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
  /* calc (credit / xonca) box */
  .calc { display: grid; grid-template-columns: .9fr 1.1fr; gap: clamp(28px, 5vw, 80px); align-items: center; padding: clamp(24px, 4vw, 60px); border-radius: var(--r-big); background: #2B1E16; color: #FAF6EF; }
  .calc h2 { color: inherit; font-size: clamp(36px, 4.6vw, 66px); line-height: 1; margin: 10px 0 14px; }
  .calc .lead { color: inherit; opacity: .75; }
  .calc .seg span { border-color: rgba(255,255,255,.25); }
  .calc .seg span small { opacity: .85; }
  .calc .seg input:checked + span { background: var(--hi); border-color: var(--hi); color: #2B1E16; }
  .calc legend { font-family: var(--f-label); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; opacity: .7; margin-bottom: 10px; }
  .calc .sum { border-top-color: rgba(255,255,255,.2); } .calc .sum b { color: inherit; } .calc .sum small { color: inherit; opacity: .7; }
  .calc .btn { background: var(--hi); color: #2B1E16; border-color: var(--hi); justify-self: start; }
  .calc-media { position: relative; border-radius: 24px; overflow: hidden; aspect-ratio: 9/14; background: #222 center / cover; }
  .calc-media video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .calc-form { display: grid; gap: 20px; }
  .ptable { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .ptable button { padding: 14px 10px; border-radius: 16px; border: 1.5px solid rgba(255,255,255,.25); background: transparent; color: inherit; cursor: pointer; text-align: center; font: 500 13px var(--f-body); transition: background .2s, border-color .2s; }
  .ptable button b { display: block; font-family: var(--f-head); font-size: 26px; font-weight: 500; }
  .ptable button[aria-pressed="true"] { background: var(--hi); border-color: var(--hi); color: #2B1E16; }
  /* occasions */
  .occ-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 26px; }
  .occ-tabs button { padding: 12px 20px; border-radius: 40px; border: 1.5px solid var(--line-strong); background: transparent; color: var(--ink); font: 600 15px var(--f-body); cursor: pointer; }
  .occ-tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

    categoriesHtml: () => '<section class="sec"><div class="sec-head"><p class="eyebrow">Kolleksiyalar</p><h2>' + "Nə üçün <em>baxırsınız?</em>" + '</h2></div><div class="cats">' + window.SITE.categories.map((c) => '<a class="cat" href="#/magaza?k=' + c.id + '"><span class="cat-img"><img src="' + c.image + '" alt="" loading="lazy" width="440" height="586"></span><span class="cat-label">' + c.label + '<small>' + P.filter((x) => x.cats.includes(c.id)).length + ' məhsul</small></span></a>').join('') + '</div></section>',
    signatureHtml: (I, wa) => SIG.map((s) => {

    onHome: (root, { card, wa, I }) => {
      const IO = 'IntersectionObserver' in window, st = still();
      const off = []; addEventListener('hashchange', () => { off.forEach((f) => f()); document.body.classList.remove('scrolled', 'xfull'); }, { once: true });
      if (H.type === 'full') {
        document.body.classList.add('xfull');
        const hdr = document.querySelector('.hdr'), hero = root.querySelector('.xh-full');
        const fit = () => { hero.style.marginTop = '-' + hdr.offsetHeight + 'px'; }; fit();
        const sc = () => document.body.classList.toggle('scrolled', scrollY > 40); sc();
        addEventListener('resize', fit); addEventListener('scroll', sc, { passive: true });
        off.push(() => { removeEventListener('resize', fit); removeEventListener('scroll', sc); hero.style.marginTop = ''; });
      }
      const hv = [...root.querySelectorAll('.xh video')]; const kick = () => hv.forEach((v) => v.paused && v.play().catch(() => {}));
      document.addEventListener('touchstart', kick, { passive: true, once: true }); document.addEventListener('click', kick, { once: true });
      const vids = [...root.querySelectorAll('video[data-src]')];
      if (!st && IO) { const vio = new IntersectionObserver((es) => es.forEach((e) => { const v = e.target; if (e.isIntersecting) { if (!v.src) v.src = v.dataset.src; v.play().catch(() => {}); } else if (v.src) v.pause(); }), { rootMargin: '150px' }); vids.forEach((v) => vio.observe(v)); }
      // mosaic crossfade
      if (H.type === 'mosaic' && !st) { const tiles = [...root.querySelectorAll('.xh-mosaic .tile')]; let n = 0; const tm = setInterval(() => { if (!root.isConnected) return clearInterval(tm); const t = tiles[n++ % tiles.length], im = [...t.querySelectorAll('img')]; if (im.length < 2) return; const c = im.findIndex((x) => x.classList.contains('on')); im[c].classList.replace('on', 'off'); im[(c + 1) % im.length].classList.replace('off', 'on'); }, 2600); }
      // live "open now"
      const lv = root.querySelector('#xLive'); if (lv && H.liveFn) { /* always open 24/7 */ }
      const bindAdd = (el) => el; // cards come from engine card()
      // tiers
      const tg = root.querySelector('#tiersGrid');
      if (tg) { const s = SIG.find((x) => x.type === 'tiers'), bar = root.querySelector('.tiers-bar'), note = root.querySelector('#tiersNote');
        const show = (b) => { bar.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b)); const lo = +b.dataset.min, hi = +b.dataset.max; const list = P.filter((p) => !p.hidden && p.price >= lo && p.price <= hi).sort((a, b) => a.price - b.price); tg.innerHTML = list.slice(0, 8).map(card).join(''); note.innerHTML = list.length ? list.length + ' buket bu aralıqda · <a class="link-arrow" href="#/magaza?min=' + lo + '&max=' + hi + '">Hamısına bax ' + '</a>' : 'Bu aralıqda hazır buket yoxdur, WhatsApp-da yazın, xüsusi yığaq.'; };
        bar.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(b); }); show(bar.querySelector('[aria-pressed="true"]')); }
      // budget
      const br = root.querySelector('#bRange');
      if (br) { const out = root.querySelector('#bOut'), g = root.querySelector('#bGrid'), note = root.querySelector('#bNote');
        const upd = () => { const v = +br.value; out.textContent = v + ' ₼'; const list = P.filter((p) => !p.hidden && p.price <= v).sort((a, b) => b.price - a.price); g.innerHTML = list.slice(0, 6).map(card).join(''); note.textContent = list.length + ' buket ' + v + ' ₼-ə qədər'; };
        br.addEventListener('input', upd); upd(); }
      // message
      const mf = root.querySelector('#mForm');
      if (mf) { const inp = root.querySelector('#mIn'), tx = root.querySelector('#mText'), pr = root.querySelector('#mPrice'), ord = root.querySelector('#mOrder');
        const upd = () => { const t = inp.value.trim() || 'Love is…'; tx.textContent = t; const z = mf.querySelector('input[name=sz]:checked'); pr.textContent = z.dataset.p + ' ₼'; ord.href = wa('Salam! Yazılı buket istəyirəm: “' + t + '”, ' + z.value + ' (' + z.dataset.p + ' AZN).'); };
        mf.addEventListener('input', upd); mf.addEventListener('submit', (e) => e.preventDefault()); upd(); }
      // calc
      const cf = root.querySelector('#cForm');
      if (cf) { const s = SIG.find((x) => x.type === 'calc'); const fn = new Function('v', 'wa', s.fn);
        const upd = () => { const v = {}; cf.querySelectorAll('input:checked').forEach((i) => { v[i.name] = i.value; v[i.name + 'T'] = i.dataset.t; }); const r = fn(v, wa); Object.entries(r.out).forEach(([k, val]) => { const el = root.querySelector('#' + k); if (el) el.textContent = val; }); root.querySelector('#cOrder').href = r.href; };
        cf.addEventListener('change', upd); cf.addEventListener('submit', (e) => e.preventDefault()); upd(); }
      // occasions
      const op = root.querySelector('#occPanel');

        const show = (k) => { const o = s.items[k]; tabs.querySelectorAll('button').forEach((b) => b.setAttribute('aria-selected', +b.dataset.k === k)); const items = P.filter((p) => p.cats.includes(o.cat)); op.innerHTML = '<div class="occ-big"><img src="' + o.img + '" alt="' + o.label + '"></div><div class="occ-txt"><p class="eyebrow">' + o.label + '</p><h3>' + o.title + '</h3><p>' + o.text + '</p><div class="occ-thumbs">' + items.slice(0, 4).map((p) => '<a href="#/mehsul/' + p.id + '"><img src="' + p.image + '" alt="' + p.name + '"></a>').join('') + '</div><a class="btn btn-lg" href="#/magaza?k=' + o.cat + '">' + items.length + ' kompozisiyaya bax ' + I.arrow + '</a></div>'; };
        tabs.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(+b.dataset.k); }); show(0); }
      
    },
    about: {"title":"Həzi Aslanovda <em>xonça evi</em>","paragraphs":["Xonça evi Həzi Aslanovda, Xudu Məmmədov 105-də toy və nişan mağazasıdır. Xonçaları satırıq və kirayə veririk, konfet yığır, paylama hazırlayırıq.","Elçilikdən toya qədər: bəy və gəlin xonçaları, “Hə” qutuları, güzgü-şamdan dəstləri, xına qədəhləri və gəlin maşını dekoru."],"images":["img/qizili-xonca-2.jpg","img/he-qutusu-narinci.jpg"]},
