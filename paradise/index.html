<style>

  /* ---------- HERO ---------- */
  .pd-hero { position: relative; overflow: hidden; isolation: isolate; }
  .pd-blob { position: absolute; z-index: -1; border-radius: 50%; filter: blur(70px); opacity: .55; animation: drift 16s ease-in-out infinite alternate; }
  .pd-blob.b1 { width: 46vw; height: 46vw; left: -12vw; top: -14vw; background: #F3C9D2; }
  .pd-blob.b2 { width: 36vw; height: 36vw; right: -8vw; bottom: -12vw; background: #F7E3C8; animation-delay: -6s; }
  @keyframes drift { to { transform: translate(6vw, 4vw) scale(1.12); } }
  .pd-in { max-width: 1440px; margin: 0 auto; padding: clamp(28px, 5vh, 60px) var(--pad) clamp(40px, 7vh, 80px); display: grid; grid-template-columns: 1.08fr .92fr; gap: clamp(30px, 5vw, 90px); align-items: center; min-height: calc(100svh - 120px); }

  .pd-hero h1 .w > span { display: inline-block; transform: translateY(105%); animation: rise 1.2s var(--ease) forwards; animation-delay: calc(.25s + var(--i) * 110ms); }
  @keyframes rise { to { transform: none; } }
  .pd-hero .lead { max-width: 44ch; font-size: 18px; color: var(--muted); opacity: 0; animation: fade 1s var(--ease) 1s forwards; }

  .pd-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; opacity: 0; animation: fade 1s var(--ease) 1.2s forwards; }
  .pd-facts { display: flex; gap: clamp(22px, 3vw, 44px); margin-top: 44px; padding-top: 26px; border-top: 1px solid var(--line-strong); opacity: 0; animation: fade 1s var(--ease) 1.4s forwards; font-size: 13px; color: var(--muted); }

  .pd-media { position: relative; justify-self: center; width: min(100%, 460px, calc((100svh - 230px) * .6)); opacity: 0; transform: translateY(30px); animation: rise2 1.4s var(--ease) .3s forwards; }

  .pd-frame { position: relative; aspect-ratio: 9 / 15; border-radius: 240px 240px 26px 26px; overflow: hidden; background: #EED9D6 center / cover; box-shadow: 0 60px 100px -50px rgba(122,23,48,.55); }

  .pd-media::before { content: ""; position: absolute; inset: -16px; border: 1px solid rgba(184,145,106,.55); border-radius: 256px 256px 34px 34px; }
  .pd-seal { position: absolute; right: -50px; top: 60px; width: 132px; height: 132px; border-radius: 50%; background: var(--cherry); color: #FBF6F3; display: grid; place-items: center; box-shadow: 0 20px 40px -20px rgba(122,23,48,.8); }

  .pd-tag { position: absolute; left: -60px; bottom: 46px; background: rgba(255,255,255,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 14px 20px; border-radius: 16px; display: grid; gap: 2px; font-size: 13px; color: var(--muted); box-shadow: 0 24px 50px -28px rgba(42,27,31,.5); transition: transform .4s var(--ease); }

  .step { padding: 44px 0 44px 76px; border-top: 1px solid var(--line-strong); position: relative; opacity: .32; transition: opacity .6s var(--ease); }

  @media (max-width: 900px) {

    .pd-frame { aspect-ratio: auto; height: 66svh; border-radius: 0 0 36px 36px; }

    .pd-tag { right: auto; left: 16px; bottom: 18px; padding: 10px 14px; } .pd-tag b { font-size: 24px; }
    .pd-hero h1 { font-size: clamp(50px, 14vw, 76px); margin-top: 10px; }
    .pd-facts { gap: 20px; margin-top: 30px; } .pd-facts b { font-size: 26px; }
    .studio { grid-template-columns: 1fr; } .studio-media { position: static; width: min(80%, 340px); }
    .step { padding: 30px 0 30px 60px; opacity: 1; } .step::before { top: 30px; font-size: 32px; }
    .reels { grid-template-columns: repeat(3, 72vw); overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 calc(-1 * var(--pad)); padding: 0 var(--pad) 10px; scroll-padding-inline: var(--pad); }

  }

    onHome: (root) => {

      const hv = root.querySelector('.pd-hero video');
      const kick = () => { if (hv && hv.paused) hv.play().catch(() => {}); };
      document.addEventListener('touchstart', kick, { passive: true, once: true }); document.addEventListener('click', kick, { once: true });
      // videolar ekrana girəndə yüklənir və oynayır
      const vids = [...root.querySelectorAll('video[data-src]')];
      if (!still && IO) {
        const vio = new IntersectionObserver((es) => es.forEach((e) => { const v = e.target;

      // studiya addımları: oxunan addım işıqlanır
      const steps = [...root.querySelectorAll('.step')];
