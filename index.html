<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>sitestudio.az</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #121510; --gold: #C8A96A; --cream: #F5EFE4; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #232a1e, var(--bg) 70%); color: var(--cream);
         font-family: 'Montserrat', sans-serif; text-align: center; padding: 24px; }
  .mk { width: 120px; height: 120px; margin: 0 auto 28px; border-radius: 50%; background: var(--gold); color: var(--bg); display: grid; place-items: center;
        font: italic 600 92px/1 'Cormorant Garamond', serif; padding: 0 6px 12px 0; position: relative; }
  .mk::after { content: ""; position: absolute; width: 13px; height: 13px; border-radius: 50%; background: var(--bg); left: 80px; top: 78px; }
  h1 { font: 600 52px/1 'Cormorant Garamond', serif; } h1 i { color: var(--gold); font-weight: 500; }
  p { color: #B8B19F; margin-top: 16px; }
  a { display: inline-block; margin-top: 28px; background: var(--gold); color: var(--bg); padding: 14px 28px; border-radius: 40px; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
  <main>
    <div class="mk">S</div>
    <h1>site<i>studio</i>.az</h1>
    <p>Bizneslər üçün premium veb saytlar · Bakı</p>
    <a href="https://www.instagram.com/sitestudio.az/">Instagram-da yazın</a>
  </main>
</body>
</html>
