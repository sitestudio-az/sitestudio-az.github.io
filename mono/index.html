      const tick = () => { if (!D.isConnected) return clearInterval(t); const s = Math.max(0, target - Date.now()) / 1000; D.textContent = Math.floor(s / 86400); H.textContent = String(Math.floor(s / 3600) % 24).padStart(2, '0'); M.textContent = String(Math.floor(s / 60) % 60).padStart(2, '0'); };
      const t = setInterval(tick, 20000); tick();
      const IO = 'IntersectionObserver' in window;

      if (!still && IO) {

      if (still || !IO) deals.forEach((d) => d.classList.add('in'));
      else { const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { setTimeout(() => e.target.classList.add('in'), deals.indexOf(e.target) * 160); io.unobserve(e.target); } }), { threshold: .45 }); deals.forEach((d) => io.observe(d)); }
      // sərgi: kompüterdə aşağı sürüşdürdükcə əsərlər yana keçir
      const sg = root.querySelector('.sergi'), track = sg.querySelector('.sergi-track'), bar = sg.querySelector('.sergi-bar'), sgN = root.querySelector('#sgN');
      const n = track.children.length; let dist = 0, raf = 0;
      const wide = () => innerWidth > 900 && !still;
      const size = () => { if (!wide()) { sg.style.height = ''; track.style.transform = ''; return; } dist = Math.max(0, track.scrollWidth - innerWidth); sg.style.height = `${innerHeight + dist}px`; frame(); };
      const frame = () => { raf = 0; const y = scrollY;
        document.body.classList.toggle('scrolled', y > 40);
        if (!wide()) return;
        const p = Math.min(1, Math.max(0, (y - sg.offsetTop) / Math.max(1, sg.offsetHeight - innerHeight)));
        track.style.transform = `translate3d(${(-p * dist).toFixed(1)}px,0,0)`; bar.style.setProperty('--p', p.toFixed(4));
        sgN.textContent = String(Math.min(n, 1 + Math.floor(p * n))).padStart(2, '0'); };
      on(window, 'scroll', () => { if (!raf) raf = requestAnimationFrame(frame); }, { passive: true });
      on(window, 'resize', size); size();
      track.querySelectorAll('img').forEach((im) => { im.loading = 'eager'; im.addEventListener('load', size, { once: true }); });
    },

        'Gündəlik buketlərdən Yeni il kompozisiyalarına və oyuncaqlı sürprizlərə qədər. Çatdırılma hər gün 09:00-dan 23:00-dək, ödəniş onlayn.',
      ],
      images: ['img/lilya-bordo.jpg', 'img/qirmizi-sam.jpg'],
    },
    finaleTitle: 'Bu gün kimisə <em>sevindirin</em>',
  };
