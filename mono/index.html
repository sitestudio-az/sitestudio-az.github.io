<style>
  :root {
    --bg: #F2EEE7; --surface: #FFFFFF; --soft: #E6E6DA; --ink: #23201D; --muted: #6C675F;
    --line: #E0D9CD; --line-strong: #CFC6B7; --sale: #B4372F; --ok: #4F7A4C;
    --accent: #5E6E55; --accent-ink: #FFFFFF; --accent-text: #4E5D46;
    --studio: #2A2623; --studio-2: #36302C; --sage: #8A9A80; --cream: #E8EDD0;
    --f-head: 'Fraunces', Georgia, serif; --f-body: 'Manrope', system-ui, sans-serif; --f-label: 'Montserrat', sans-serif;
    --w-head: 300; --ls-head: -.02em;
    --r-card: 6px; --r-btn: 4px; --r-img: 6px; --r-big: 10px;
    --hdr-bg: rgba(242,238,231,.9); --demo-bg: #23201D;
    --finale-bg: #2A2623; --finale-ink: #F2EEE7; --finale-accent: #C9D3AE; --finale-btn: #E8EDD0; --finale-btn-ink: #23201D;
    --card-shadow: 0 30px 60px -40px rgba(30,25,20,.6);
  }
  .eyebrow, .pcat, .nav, .ftr h3, .filters legend, .sizes legend, .btn { font-family: var(--f-label); }
  .eyebrow { letter-spacing: .3em; font-size: 11.5px; }
  h2 em, h1 em { font-weight: 300; }
  .pcard { border: 1px solid var(--line); }
  .pcard-img { aspect-ratio: 3 / 4; }
  .price s { color: var(--sale); opacity: .8; }

  .m-logo { display: flex; align-items: center; gap: 14px; }
  .m-logo img { height: 46px; width: auto; }
  .m-logo span { font-family: var(--f-label); font-size: 10.5px; letter-spacing: .42em; text-transform: uppercase; color: var(--muted); padding-left: 14px; border-left: 1px solid var(--line-strong); line-height: 1.5; }

  /* ---------- HERO: studiya qalereyası ---------- */
  .m-hero { position: relative; isolation: isolate; background: radial-gradient(900px 600px at 70% 30%, #4A423C 0%, var(--studio) 60%, #1D1A18 100%); color: #F2EEE7; overflow: hidden; }
  .m-hero-in { display: grid; grid-template-columns: .9fr 1.1fr; align-items: center; gap: clamp(24px, 4vw, 64px); max-width: 1440px; margin: 0 auto; padding: clamp(40px, 6vw, 90px) var(--pad) clamp(56px, 7vw, 110px); }
  .m-hero .eyebrow { color: var(--sage); } .m-hero .eyebrow::before { background: var(--sage); }
  .m-hero h1 { font-size: clamp(54px, 7.4vw, 118px); line-height: .94; margin: 24px 0 24px; font-weight: 300; }
  .m-hero h1 em { color: var(--cream); font-style: italic; }
  .m-hero h1 .ln { display: block; clip-path: inset(0 0 100% 0); animation: unveil 1.1s var(--ease) forwards; animation-delay: var(--d); }
  @keyframes unveil { to { clip-path: inset(0 0 -10% 0); } }
  .m-hero .lead { color: #BDB4A8; max-width: 44ch; opacity: 0; animation: fade .9s var(--ease) .7s forwards; }
  @keyframes fade { to { opacity: 1; } }
  .m-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; opacity: 0; animation: fade .9s var(--ease) .85s forwards; }
  .m-cta .btn { background: var(--cream); color: var(--studio); border-color: var(--cream); }
  .m-cta .btn-ghost { background: transparent; color: #F2EEE7; border-color: rgba(242,238,231,.35); }
  .m-info { display: flex; flex-wrap: wrap; gap: 26px; margin-top: 40px; padding-top: 24px; border-top: 1px solid rgba(242,238,231,.14); font-size: 13.5px; color: #A9A094; opacity: 0; animation: fade .9s var(--ease) 1s forwards; }
  .m-info b { display: block; color: #F2EEE7; font-family: var(--f-head); font-weight: 300; font-size: 24px; }
  .wall { position: relative; display: grid; grid-template-columns: 1fr 1.25fr 1fr; align-items: end; gap: clamp(10px, 1.6vw, 22px); }
  .frame { position: relative; will-change: transform; }
  .frame figure { position: relative; background: #1B1816; padding: clamp(6px, .8vw, 10px); box-shadow: 0 40px 70px -30px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.06); opacity: 0; transform: translateY(40px); animation: hang 1.2s var(--ease) forwards; animation-delay: var(--d); }
  @keyframes hang { to { opacity: 1; transform: none; } }
  .frame img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; filter: brightness(.55) saturate(.8); animation: light 1.6s var(--ease) forwards; animation-delay: calc(var(--d) + .5s); }
  @keyframes light { to { filter: none; } }
  .frame.mid img { aspect-ratio: 3 / 4.3; }
  .frame::before { content: ""; position: absolute; left: 50%; top: -40%; width: 140%; height: 70%; transform: translateX(-50%); background: radial-gradient(ellipse at top, rgba(255,240,210,.22), transparent 70%); opacity: 0; animation: fade 1.6s var(--ease) forwards; animation-delay: calc(var(--d) + .4s); pointer-events: none; }
  .tag-card { margin-top: 14px; font-size: 12.5px; color: #A9A094; display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid rgba(242,238,231,.14); padding-top: 10px; opacity: 0; animation: fade .8s var(--ease) forwards; animation-delay: calc(var(--d) + 1s); }
  .tag-card b { color: #F2EEE7; font-weight: 600; }
  .tag-card s { color: #D9786F; margin-right: 6px; }

  /* Yeni il geri sayımı */
  .ny { background: var(--accent); color: #fff; }
  .ny-in { max-width: var(--maxw); margin: 0 auto; padding: 26px var(--pad); display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .ny p { font-family: var(--f-label); font-size: 12px; letter-spacing: .3em; text-transform: uppercase; opacity: .85; }
  .ny h2 { margin: 4px 0 0; font-size: clamp(26px, 3vw, 38px); color: #fff; }
  .cd { display: flex; gap: 10px; }
  .cd div { min-width: 76px; text-align: center; padding: 10px 8px; border: 1px solid rgba(255,255,255,.28); border-radius: 4px; }
  .cd b { display: block; font-family: var(--f-head); font-weight: 300; font-size: 36px; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
  .cd span { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
  .ny .btn { background: var(--cream); color: var(--studio); border-color: var(--cream); }

  /* endirim etiketləri */
  .deals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
  .deal { position: relative; display: block; background: var(--surface); border: 1px solid var(--line); }
  .deal img { width: 100%; aspect-ratio: 3/4; object-fit: cover; }
  .deal-label { position: absolute; left: 14px; bottom: 14px; right: 14px; background: rgba(35,32,29,.88); color: #F2EEE7; backdrop-filter: blur(6px); padding: 14px 16px; display: grid; gap: 2px; }
  .deal-label > span:first-child { font-size: 13px; color: #BDB4A8; }
  .deal-prices { display: flex; align-items: baseline; gap: 14px; }
  .old { position: relative; font-size: 18px; color: #BDB4A8; }
  .old::after { content: ""; position: absolute; left: -4px; right: -4px; top: 52%; height: 2px; background: #D9786F; transform: scaleX(0) rotate(-8deg); transform-origin: left; transition: transform .6s var(--ease); }
  .new { font-family: var(--f-head); font-weight: 400; font-size: 34px; line-height: 1; color: #fff; opacity: 0; transform: translateY(-14px); transition: opacity .5s, transform .6s var(--ease); transition-delay: .45s; }
  .deal.in .old::after { transform: scaleX(1) rotate(-8deg); }
  .deal.in .new { opacity: 1; transform: none; }
  .save { position: absolute; top: 14px; right: 14px; background: var(--sale); color: #fff; font-family: var(--f-label); font-size: 12px; font-weight: 600; letter-spacing: .06em; padding: 7px 10px; transform: scale(0) rotate(-12deg); transition: transform .5s var(--ease) .8s; }
  .deal.in .save { transform: scale(1) rotate(-6deg); }

  /* büdcə */
  .budget2 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .budget2 a { position: relative; display: grid; align-content: end; min-height: 300px; padding: 34px; color: #F2EEE7; overflow: hidden; isolation: isolate; }
  .budget2 a::before { content: ""; position: absolute; inset: 0; background: var(--img) center / cover; z-index: -2; transition: transform 1s var(--ease); }
  .budget2 a::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(35,32,29,0) 25%, rgba(35,32,29,.88)); z-index: -1; }
  .budget2 b { font-family: var(--f-head); font-weight: 300; font-size: clamp(44px, 5vw, 70px); line-height: 1; }
  .budget2 span { font-size: 15px; color: #D8D0C4; }
  @media (hover: hover) { .budget2 a:hover::before { transform: scale(1.05); } }

  .cats { --cat-cols: 5; }
  .cat-img { border-radius: 4px; aspect-ratio: 3/4; max-width: 220px; }

  @media (prefers-reduced-motion: reduce) {
    .m-hero h1 .ln { clip-path: none !important; } .m-hero .lead, .m-cta, .m-info, .tag-card, .frame::before { opacity: 1 !important; }
    .frame figure { opacity: 1 !important; transform: none !important; } .frame img { filter: none !important; }
    .old::after { transform: scaleX(1) rotate(-8deg) !important; } .new { opacity: 1 !important; transform: none !important; } .save { transform: none !important; }
  }
  @media (max-width: 1000px) { .deals { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 900px) {
    .m-hero-in { grid-template-columns: 1fr; padding-top: 28px; }
    .wall { order: -1; grid-template-columns: .85fr 1.2fr .85fr; gap: 8px; }
    .tag-card { font-size: 11px; flex-direction: column; gap: 2px; }
    .m-hero h1 { font-size: clamp(48px, 13vw, 70px); }
    .ny-in { flex-direction: column; align-items: flex-start; } .cd div { min-width: 64px; } .cd b { font-size: 28px; }
    .budget2 { grid-template-columns: 1fr; } .budget2 a { min-height: 210px; }
    .m-logo span { display: none; } .m-logo img { height: 40px; }
    .deal-label { left: 8px; right: 8px; bottom: 8px; padding: 10px 12px; } .new { font-size: 26px; } .old { font-size: 15px; }
    .deals { gap: 12px; }
  }
</style>
