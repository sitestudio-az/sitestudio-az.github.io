<style>
  :root {
    --bg: #0C1517; --surface: #121E21; --soft: #18292D; --ink: #F2EEE7; --muted: #A4B1B0;
    --line: #1F3134; --line-strong: #2F474B; --sale: #D0473F; --ok: #6FD3A0;
    --accent: #0E8597; --accent-ink: #FFFFFF; --accent-text: #72CCD8;
    --f-head: 'Playfair Display', Georgia, serif; --f-body: 'Inter', system-ui, sans-serif; --w-head: 500;
    --r-card: 18px; --r-btn: 40px; --r-img: 22px; --r-big: 28px;
    --hdr-bg: rgba(12,21,23,.86); --demo-bg: #0E8597; --logo-h: 62px; --ftr-bg: #0A1214;
    --finale-bg: linear-gradient(135deg, #0E8597 0%, #08515C 100%); --finale-ink: #FFFFFF; --finale-accent: #BFEFF5; --finale-btn: #FFFFFF; --finale-btn-ink: #08515C;
    --card-line: #1C2D30; --card-shadow: 0 40px 70px -40px rgba(0,0,0,.9);
  }
  body { background: radial-gradient(1200px 700px at 85% -10%, rgba(14,133,151,.22), transparent 60%), var(--bg); }
  .pbadge { background: var(--accent); color: #fff; }

  /* hero: canlı Bakı saatı */
  .v-hero { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 5vw, 80px); align-items: center; max-width: 1400px; margin: 0 auto;
            padding: clamp(36px, 6vw, 90px) var(--pad) clamp(56px, 8vw, 110px); }
  .v-hero h1 { font-size: clamp(52px, 7.4vw, 112px); line-height: .95; margin: 24px 0 24px; }
  .v-hero h1 em { color: var(--accent-text); }
  .v-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
  .v-clock { display: inline-flex; align-items: center; gap: 18px; margin-top: 40px; padding: 16px 22px 16px 18px; border: 1px solid var(--line-strong); border-radius: 18px; background: rgba(18,30,33,.7); }
  .v-clock .dot { width: 12px; height: 12px; border-radius: 50%; background: #3DDC97; box-shadow: 0 0 0 0 rgba(61,220,151,.6); animation: pulse 2s infinite; flex: none; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 12px rgba(61,220,151,0); } 100% { box-shadow: 0 0 0 0 rgba(61,220,151,0); } }
  .v-clock time { font-family: var(--f-head); font-size: 40px; line-height: 1; font-variant-numeric: lining-nums tabular-nums; letter-spacing: .02em; }
  .v-clock span { font-size: 14px; color: var(--muted); line-height: 1.4; } .v-clock b { color: var(--ink); display: block; font-size: 15px; }
  .v-media { position: relative; }
  .v-media img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 240px 240px 28px 28px; box-shadow: 0 60px 100px -50px rgba(0,0,0,.95); }
  .v-mono { position: absolute; left: -30px; bottom: 40px; width: 120px; height: 120px; border-radius: 50%; background: var(--accent); display: grid; place-items: center;
            box-shadow: 0 30px 60px -20px rgba(0,0,0,.7); animation: spin 30s linear infinite; }
  .v-mono img { width: 70%; height: auto; aspect-ratio: auto; border-radius: 0; box-shadow: none; animation: spin 30s linear infinite reverse; }
  .v-mono svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .cats { --cat-cols: 4; }
  .cat-img { background: var(--accent); box-shadow: 0 0 0 1px var(--line-strong); }

  /* bürc kartı seçicisi */
  .v-zod { display: grid; grid-template-columns: .75fr 1.25fr; gap: clamp(28px, 5vw, 72px); align-items: center; background: var(--surface); border: 1px solid var(--line);
           border-radius: 28px; overflow: hidden; }
  .v-zod > img { width: 100%; height: 100%; object-fit: cover; min-height: 420px; max-height: 560px; }
  .v-zod-in { padding: clamp(28px, 4vw, 56px) clamp(24px, 4vw, 56px) clamp(28px, 4vw, 56px) 0; }
  .zgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 26px 0 22px; }
  .zgrid button { display: grid; gap: 2px; justify-items: center; padding: 10px 4px; border: 1px solid var(--line-strong); border-radius: 14px; font-size: 11.5px; color: var(--muted); transition: all .25s; min-height: 44px; }
  .zgrid button i { font-style: normal; font-size: 22px; color: var(--accent-text); line-height: 1.1; }
  .zgrid button:hover { color: var(--ink); border-color: var(--accent); }
  .zgrid button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; } .zgrid button[aria-pressed="true"] i { color: #fff; }
  .zres { min-height: 52px; color: var(--muted); }
  .zres b { color: var(--ink); }
  @media (max-width: 900px) {
    .v-hero { grid-template-columns: 1fr; } .v-media { order: -1; max-width: 440px; margin: 0 auto; width: 100%; }
    .v-media img { aspect-ratio: 1; } .v-mono { width: 92px; height: 92px; left: 6px; bottom: 16px; }
    .v-zod { grid-template-columns: 1fr; } .v-zod > img { min-height: 280px; max-height: 360px; } .v-zod-in { padding: 4px 22px 28px; }
    .zgrid { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>

<script>

    { id: 'qrinc-qutusu', name: 'Qrinç qutusu', cats: ['yeniil', 'komp'], colors: ['qirmizi', 'yasil'], price: 165, badge: 'Xüsusi', featured: true, image: 'img/p6.jpg',
      desc: 'Qırmızı qızılgüllər və yaşıl Qrinç, Valentino məxmər qutusunda. Bayramın ən şən hədiyyəsi.' },
    { id: 'tund-benovseyi', name: 'Tünd bənövşəyi buket', cats: ['buket'], colors: ['benovseyi'], price: 140, image: 'img/p2.jpg',
      desc: 'Dalğalı qablaşdırmada tünd bənövşəyi xrizantemalar. Dərin və zərif.' },
    { id: 'qar-agi', name: 'Qar ağı kompozisiya', cats: ['yeniil', 'komp'], colors: ['ag'], price: 210, image: 'img/p4.jpg',

      desc: 'Çəhrayı hortenziya və güllər, təbrik yazılı lent və bürc kartı ilə.' },
    { id: 'retro-masin', name: 'Retro qırmızı maşın', cats: ['yeniil', 'usaq', 'komp'], colors: ['qirmizi'], price: 185, image: 'img/p10.jpg',
      desc: 'Qırmızı retro maşın, şam budaqları və güllərlə Yeni il kompozisiyası.' },

  heroHtml: (I, wa) => `
    <section class="v-hero">
      <div>
        <p class="eyebrow">Azadlıq prospekti · 7/24</p>
        <h1>Hər hissin<br><em>öz çiçəyi</em></h1>
        <p class="lead">Ad günü, bayram, uşaq sürprizi və ya sadəcə “səni düşünürəm”. Buket əl ilə, sizin anınız üçün yığılır.</p>
        <div class="v-cta"><a class="btn btn-lg" href="#/magaza">Buket seç ${I.arrow}</a>
          <a class="btn btn-ghost btn-lg" href="${wa('Salam! Buket sifariş etmək istəyirəm.')}" target="_blank" rel="noopener">${I.wa}<span>WhatsApp</span></a></div>
        <div class="v-clock" aria-live="off"><i class="dot" aria-hidden="true"></i><time id="vClock">--:--</time><span><b>Bakıda indi. Açığıq.</b>Gecə-gündüz sifariş qəbul edirik</span></div>

      <div class="v-media">
        <img src="img/hero.jpg" alt="Ağ və qızılı bəzəkli Yeni il ağacı kompozisiyası" width="640" height="800" fetchpriority="high">
        <div class="v-mono" aria-hidden="true"><svg viewBox="0 0 120 120"><defs><path id="circ" d="M60 60 m-46 0 a46 46 0 1 1 92 0 a46 46 0 1 1 -92 0"/></defs>
          <text font-family="Inter" font-size="9.5" letter-spacing="3.2" fill="#fff"><textPath href="#circ">VALENTINO FLOWERS · 7/24 · BAKI · </textPath></text></svg>
          <img src="img/logo.png" alt="" width="122" height="92" style="width:44%"></div>
      </div>
    </section>`,
  categoriesHtml: () => `
    <section class="sec">
      <div class="sec-head"><p class="eyebrow">Kolleksiyalar</p><h2>Nə üçün <em>axtarırsınız?</em></h2></div>
      <div class="cats">${window.SITE.categories.map((c) => `<a class="cat" href="#/magaza?k=${c.id}"><span class="cat-img"><img src="${c.image}" alt="" loading="lazy" width="200" height="200"></span><span class="cat-label">${c.label}<small>${window.SITE.products.filter((p) => p.cats.includes(c.id)).length} məhsul</small></span></a>`).join('')}</div>
    </section>`,
  signatureHtml: (I) => `
    <section class="sec sig">
      <div class="v-zod">
        <img src="img/burc.jpg" alt="Valentino imzalı bürc kartı" loading="lazy" width="640" height="640">
        <div class="v-zod-in">
          <p class="eyebrow">Bürc kartı</p>
          <h2>Onun bürcü <em>hansıdır?</em></h2>
          <p class="lead" style="margin-top:16px">Bürcü seçin, buketə həmin bürcün imzalı kartını əlavə edək.</p>
          <div class="zgrid" id="zgrid"></div>
          <p class="zres" id="zres">Bürc seçilməyib.</p>
          <a class="btn" id="zbtn" href="#/magaza">Buket seç ${I.arrow}</a>
        </div>
      </div>
    </section>`,
  onHome: (root, { wa }) => {
    const clock = root.querySelector('#vClock');
    const fmt = new Intl.DateTimeFormat('az-AZ', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Baku' });
    const tick = () => { if (clock.isConnected) clock.textContent = fmt.format(new Date()); };
    tick(); const t = setInterval(() => { if (!clock.isConnected) clearInterval(t); else tick(); }, 15000);
    const Z = [['♈', 'Qoç'], ['♉', 'Buğa'], ['♊', 'Əkizlər'], ['♋', 'Xərçəng'], ['♌', 'Şir'], ['♍', 'Qız'], ['♎', 'Tərəzi'], ['♏', 'Əqrəb'], ['♐', 'Oxatan'], ['♑', 'Oğlaq'], ['♒', 'Dolça'], ['♓', 'Balıqlar']];
    const g = root.querySelector('#zgrid'), res = root.querySelector('#zres');
    g.innerHTML = Z.map(([s, n]) => `<button type="button" aria-pressed="false" data-z="${n}"><i aria-hidden="true">${s}︎</i>${n}</button>`).join('');
    g.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      g.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
      res.innerHTML = `<b>${b.dataset.z}</b> kartı seçildi. Buketi seçin, sifarişdə “Vizitka” xanasına <b>${b.dataset.z}</b> yazın, ya da WhatsApp-da bildirin.`;
      root.querySelector('#zbtn').outerHTML = `<a class="btn" id="zbtn" href="${wa('Salam! ' + b.dataset.z + ' bürc kartlı buket istəyirəm.')}" target="_blank" rel="noopener">${b.dataset.z} kartlı buket sifariş et</a>`;
    });
  },
