  .stage { transition: transform .25s linear; }

    onHome: (root, { P, card }) => {
      // hero: dərinlik paralaksı (yalnız hərəkət icazəsi olanda)
      const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const bubs = [...root.querySelectorAll('.bub')];
      if (!still && bubs.length) {
        let raf = 0;
        const em = root.querySelector('.c-hero h1 em'), stage = root.querySelector('.stage'), wide = matchMedia('(min-width: 901px)').matches;
        const move = () => {
          raf = 0; const y = Math.min(scrollY, 900), k = Math.min(1, y / 600);
          bubs.forEach((b) => { b.style.transform = `translate3d(0, ${(-y * b.dataset.depth).toFixed(1)}px, 0)`; });

          if (em) em.style.transform = `translate3d(${(k * (wide ? 90 : 28)).toFixed(1)}px, ${(-k * 10).toFixed(1)}px, 0)`;
          if (stage) stage.style.transform = `scale(${(1 - k * .06).toFixed(3)}) rotate(${(k * -4).toFixed(2)}deg)`;
        };
        const onScroll = () => { if (!raf) raf = requestAnimationFrame(move); };
        addEventListener('scroll', onScroll, { passive: true });
        addEventListener('hashchange', () => removeEventListener('scroll', onScroll), { once: true });
