<style>
  :root {
    --bg: #FBF6F0; --surface: #FFFFFF; --soft: #F6E9E3; --ink: #3A2A2C; --muted: #7C6866;
    --line: #EEDFD6; --line-strong: #E1C9BD; --sale: #A8324E; --ok: #3E8E5E;
    --accent: #A8324E; --accent-ink: #FFFFFF; --accent-text: #962A45;
    --gold: #C3A06A; --blush: #F3D3CF;
    --f-head: 'Gilda Display', Georgia, serif; --f-body: 'Jost', system-ui, sans-serif; --f-script: 'Pinyon Script', cursive;
    --w-head: 400; --ls-head: -.01em; --em-style: normal;
    --r-card: 20px; --r-btn: 40px; --r-img: 24px; --r-big: 32px;
    --hdr-bg: rgba(251,246,240,.9); --demo-bg: #3A2A2C;
    --finale-bg: linear-gradient(140deg, #4A2430 0%, #2E1C20 100%); --finale-ink: #FBF6F0; --finale-accent: #E9C9A0;
    --finale-btn: #F3D3CF; --finale-btn-ink: #3A2A2C;
    --card-shadow: 0 36px 70px -42px rgba(90,40,50,.55);
  }
  body { background: radial-gradient(900px 600px at 0% 0%, #F8E7E1 0%, transparent 65%), radial-gradient(900px 700px at 100% 30%, #F6EEDF 0%, transparent 60%), var(--bg); }
  /* başlıqlarda vurğulanan söz loqodakı kimi kursiv yazı ilə */
  h1 em, h2 em, .h-page em { font-family: var(--f-script); font-style: normal; font-weight: 400; font-size: 1.32em; line-height: .6; letter-spacing: 0; color: var(--accent-text); }
  .eyebrow { color: #9A7B4F; } .eyebrow::before { background: var(--gold); }
  .pbadge-bestseller { background: var(--gold); color: #fff; }
  .pcard { box-shadow: 0 20px 44px -36px rgba(90,40,50,.5); }

  /* loqo */
  .r-logo { display: flex; align-items: center; gap: 12px; }
  .r-logo img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 1px var(--gold); }
  .r-logo span { font-family: var(--f-script); font-size: 34px; line-height: .9; color: #7A5A46; white-space: nowrap; }
  .r-logo small { display: block; font-family: var(--f-body); font-size: 9.5px; letter-spacing: .38em; text-transform: uppercase; color: #9A7B4F; margin-top: 4px; }

  /* ---------- HERO: qızılgül pilləkəni videosu ---------- */
  .r-hero { position: relative; display: grid; grid-template-columns: 1fr .95fr; align-items: center; gap: clamp(24px, 5vw, 80px);
            max-width: 1400px; margin: 0 auto; padding: clamp(28px, 4vw, 60px) var(--pad) clamp(48px, 7vw, 100px); }
  .r-hero h1 { font-size: clamp(54px, 7.2vw, 112px); line-height: .96; margin: 24px 0 26px; }
  .r-hero h1 em { display: inline-block; font-size: 1.45em; margin-left: .08em; will-change: transform; transition: transform .2s linear; }
  .r-hero h1 .ln { display: block; opacity: 0; transform: translateY(30px); animation: up 1s var(--ease) forwards; animation-delay: var(--d); }
  @keyframes up { to { opacity: 1; transform: none; } }
  .r-hero .lead, .r-cta, .r-facts { opacity: 0; animation: up .9s var(--ease) forwards; }
  .r-hero .lead { font-size: 18.5px; animation-delay: .6s; }
  .r-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; animation-delay: .75s; }
  .r-facts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; animation-delay: .9s; }
  .r-facts span { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 30px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .r-facts svg { width: 17px; height: 17px; color: var(--accent); }
  .r-stage { position: relative; justify-self: center; width: min(100%, 470px); }
  .r-arch { position: relative; aspect-ratio: 9 / 13.2; border-radius: 999px 999px 26px 26px; overflow: hidden; background: #2b1a1d url(img/pilleken-cover.jpg) center / cover;
            box-shadow: 0 60px 110px -50px rgba(90,30,45,.75); clip-path: inset(100% 0 0 0 round 999px 999px 26px 26px); animation: reveal 1.4s var(--ease) .2s forwards; transition: transform .25s linear; }
  @keyframes reveal { to { clip-path: inset(0 0 0 0 round 999px 999px 26px 26px); } }
  .r-arch video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .r-arch::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 60%, rgba(40,15,20,.35)); pointer-events: none; }
  .r-frame { position: absolute; inset: -14px; border: 1px solid var(--gold); border-radius: 999px 999px 34px 34px; pointer-events: none; opacity: 0; animation: up 1s var(--ease) 1s forwards; }
  .r-circle { position: absolute; left: -16%; bottom: 8%; width: 42%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; border: 6px solid var(--bg);
              box-shadow: 0 30px 60px -24px rgba(90,30,45,.6); opacity: 0; transform: scale(.6); animation: pop .9s var(--ease) 1.1s forwards; }
  .r-circle video, .r-circle img { width: 100%; height: 100%; object-fit: cover; }
  @keyframes pop { to { opacity: 1; transform: none; } }
  .r-seal { position: absolute; right: -9%; top: 10%; width: 128px; height: 128px; display: grid; place-items: center; opacity: 0; animation: up .9s var(--ease) 1.3s forwards; }
  .r-seal svg { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 26s linear infinite; }
  .r-seal img { width: 72px; height: 72px; border-radius: 50%; box-shadow: 0 10px 24px -10px rgba(0,0,0,.4); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* hekayə dairələri (Instagram highlight-ları kimi) */
  .stories { display: flex; gap: clamp(14px, 2.2vw, 28px); justify-content: center; flex-wrap: wrap; }
  .story { display: grid; justify-items: center; gap: 10px; width: 112px; text-align: center; font-size: 14px; color: var(--ink); }
  .story i { position: relative; width: 96px; height: 96px; border-radius: 50%; padding: 3px; background: conic-gradient(from 210deg, var(--gold), #E58FA0, var(--accent), var(--gold)); transition: transform .4s var(--ease); }
  .story i img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--bg); }
  .story small { font-size: 12px; color: var(--muted); margin-top: -6px; }
  @media (hover: hover) { .story:hover i { transform: translateY(-5px) rotate(-4deg); } }

  /* imza: neçə qızılgül? */
  .counter { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 5vw, 80px); align-items: center; background: var(--surface); border: 1px solid var(--line);
             border-radius: 36px; padding: clamp(24px, 4vw, 56px); box-shadow: 0 50px 90px -60px rgba(90,30,45,.5); }
  .c-media { position: relative; aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: var(--soft); box-shadow: 0 0 0 10px var(--soft), 0 0 0 11px var(--line-strong); }
  .c-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .9s var(--ease), opacity .6s; transform: scale(var(--k, 1)); }
  .c-media img.out { opacity: 0; }
  .c-num { font-family: var(--f-head); font-size: clamp(96px, 13vw, 180px); line-height: .85; color: var(--accent-text); font-variant-numeric: lining-nums tabular-nums; margin: 18px 0 4px; }
  .c-num small { font-family: var(--f-script); font-size: .34em; color: var(--ink); margin-left: 10px; }
  .seg-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 14px; }
  .seg-row button { min-width: 64px; min-height: 46px; padding: 0 16px; border-radius: 30px; border: 1px solid var(--line-strong); font-size: 15px; font-weight: 500; color: var(--muted); transition: all .3s; }
  .seg-row button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 10px 22px -10px var(--accent); }
  .seg-row.colors button { display: inline-flex; align-items: center; gap: 8px; }
  .seg-row.colors i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .c-price { display: flex; align-items: baseline; gap: 12px; margin: 18px 0 22px; font-size: 15px; color: var(--muted); }
  .c-price b { font-family: var(--f-head); font-weight: 400; font-size: 44px; color: var(--ink); font-variant-numeric: lining-nums; }

  .finale-card h2 em { color: var(--finale-accent); }
  .finale-card h2, .counter h2, .about-txt h2 { padding-bottom: .22em; }
  .finale-card::after { content: ""; position: absolute; right: -50px; top: -50px; width: 300px; height: 300px; border-radius: 50%; border: 1px solid rgba(233,201,160,.35); box-shadow: 0 0 0 40px rgba(233,201,160,.05), 0 0 0 80px rgba(233,201,160,.04); pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    .r-hero h1 .ln, .r-hero .lead, .r-cta, .r-facts, .r-frame, .r-circle, .r-seal { opacity: 1 !important; transform: none !important; }
    .r-arch { clip-path: none !important; } .r-seal svg { animation: none !important; }
  }
  @media (max-width: 900px) {
    .r-hero { grid-template-columns: 1fr; padding-top: 18px; }
    .r-stage { order: -1; width: min(82%, 380px); margin-bottom: 8px; }
    .r-arch { aspect-ratio: 9 / 11.5; }
    .r-circle { left: -12%; width: 38%; }
    .r-seal { right: -12%; top: 4%; width: 100px; height: 100px; } .r-seal img { width: 56px; height: 56px; }
    .r-hero h1 { font-size: clamp(48px, 13vw, 68px); }
    .stories { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; margin: 0 calc(var(--pad) * -1); padding: 4px var(--pad) 10px; scrollbar-width: none; scroll-padding-inline: var(--pad); scroll-snap-type: x mandatory; }
    .stories::-webkit-scrollbar { display: none; }
    .story { flex: 0 0 84px; width: 84px; scroll-snap-align: start; font-size: 13px; } .story i { width: 76px; height: 76px; }
    .counter { grid-template-columns: 1fr; } .c-media { max-width: 340px; width: 100%; margin: 0 auto; }
    .r-logo span { font-size: 28px; } .r-logo img { width: 42px; height: 42px; } .r-logo small { font-size: 8px; letter-spacing: .3em; }
  }
</style>
</head>

    heroHtml: (I) => `

        <nav class="stories" aria-label="Kolleksiyalar">${window.SITE.categories.map((c) => `<a class="story" href="#/magaza?k=${c.id}"><i><img src="${c.image}" alt="" loading="lazy" width="150" height="150"></i>${c.label}<small>${window.SITE.products.filter((x) => !x.hidden && x.cats.includes(c.id)).length} məhsul</small></a>`).join('')}</nav>

    signatureHtml: (I) => `
      <section class="sec sig" id="neqeder">
        <div class="counter">
          <div class="c-media" id="cMedia"><img src="img/qirmizi-101.jpg" alt="Qızılgül buketi" width="800" height="1000" id="cImg"></div>

            <p class="eyebrow">101 Roses</p>
            <h2>Neçə qızılgül <em>deyək?</em></h2>
            <div class="c-num" aria-live="polite"><span id="cNum">101</span><small>qızılgül</small></div>
            <div class="seg-row" role="group" aria-label="Qızılgül sayı">${COUNTS.map((n) => `<button type="button" data-n="${n}" aria-pressed="${n === 101}">${n}</button>`).join('')}</div>
            <div class="seg-row colors" role="group" aria-label="Rəng">${ROSE.map((c, i) => `<button type="button" data-c="${c.id}" aria-pressed="${i === 0}"><i style="--c:${c.hex}"></i>${c.label}</button>`).join('')}</div>
            <div class="c-price"><b id="cPrice"></b><span>imzalı qablaşdırma daxil</span></div>

          </div>
        </div>
      </section>`,
    onHome: (root, { all, addToCart, money }) => {
      const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      // videolar: hərəkəti azaldanlar üçün dayanır, yalnız poster qalır
      root.querySelectorAll('video').forEach((v) => { if (still) { v.removeAttribute('autoplay'); v.pause(); } else v.play().catch(() => {}); });
      // hero: sürüşdürdükcə kursiv söz və video tağı birlikdə hərəkət edir
      const em = root.querySelector('.r-hero h1 em'), arch = root.querySelector('.r-arch');
      if (!still && em) {
        let raf = 0; const move = () => { raf = 0; const k = Math.min(1, scrollY / 600); em.style.transform = `translate3d(${(k * 70).toFixed(1)}px, 0, 0) rotate(${(-k * 4).toFixed(2)}deg)`; arch.style.transform = `translateY(${(k * -30).toFixed(1)}px) scale(${(1 - k * .05).toFixed(3)})`; };
        const on = () => { if (!raf) raf = requestAnimationFrame(move); };
        addEventListener('scroll', on, { passive: true }); addEventListener('hashchange', () => removeEventListener('scroll', on), { once: true });
      }
      // imza: neçə qızılgül?
      let n = 101, color = ROSE[0], shown = 101;
      const num = root.querySelector('#cNum'), price = root.querySelector('#cPrice'), img = root.querySelector('#cImg');
      const count = (to) => {
        if (still) { num.textContent = to; shown = to; return; }
        const from = shown, t0 = performance.now(), dur = 700;
        const step = (t) => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); const v = Math.round(from + (to - from) * e); num.textContent = v; if (k < 1) requestAnimationFrame(step); else shown = to; };
        requestAnimationFrame(step);
      };
      const upd = (swap) => {
        count(n); price.textContent = money(rosePrice(color, n));
        img.style.setProperty('--k', (0.82 + Math.min(1, n / 301) * 0.28).toFixed(3));
        if (swap && img.getAttribute('src') !== color.img) { img.classList.add('out'); setTimeout(() => { img.src = color.img; img.classList.remove('out'); }, 300); }
      };
      root.querySelectorAll('[data-n]').forEach((b) => b.addEventListener('click', () => { n = +b.dataset.n; root.querySelectorAll('[data-n]').forEach((x) => x.setAttribute('aria-pressed', x === b)); upd(false); }));
      root.querySelectorAll('[data-c]').forEach((b) => b.addEventListener('click', () => { color = ROSE.find((c) => c.id === b.dataset.c); root.querySelectorAll('[data-c]').forEach((x) => x.setAttribute('aria-pressed', x === b)); upd(true); }));
      root.querySelector('#cAdd').addEventListener('click', () => addToCart(`qizilgul-${color.id}-${n}`));
      price.textContent = money(rosePrice(color, n)); img.style.setProperty('--k', (0.82 + (101 / 301) * 0.28).toFixed(3));
    },
    about: {
      title: 'Roses Baku <em>butiki</em>',
      paragraphs: [

        'Sifarişləri gecə-gündüz qəbul edirik, ödənişi onlayn, dünyanın hər yerindən etmək olur. Uzaqdan sevdiklərinizi təbrik etmək asandır.',
      ],
      images: ['img/hortenziya-sebet.jpg', 'img/qirmizi-sutun.jpg'],
    },
    finaleTitle: 'Gecə də, gündüz də <em>qızılgül</em>',
  };
