  /* ---------- HERO: planet ---------- */
  .cz-hero { position: relative; overflow: hidden; isolation: isolate; }
  #stars { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
  .cz-in { max-width: 1440px; margin: 0 auto; padding: clamp(30px, 5vh, 60px) var(--pad) clamp(50px, 8vh, 90px); display: grid; grid-template-columns: 1fr 1fr; gap: clamp(30px, 5vw, 80px); align-items: center; min-height: calc(100svh - 110px); }

  .cz-hero h1 .ln { display: block; opacity: 0; transform: translateY(30px); filter: blur(10px); animation: in 1.2s var(--ease) forwards; animation-delay: var(--d); }

  .moon { position: absolute; z-index: 3; left: 50%; top: 50%; width: 74px; height: 74px; margin: -37px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(255,255,255,.7); box-shadow: 0 10px 30px rgba(0,0,0,.6); offset-path: path("M -260 40 A 290 64 -16 1 0 260 -40 A 290 64 -16 1 0 -260 40"); animation: orbit 14s linear infinite; }

    .orbit-vids { grid-template-columns: repeat(3, 72vw); overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 calc(-1 * var(--pad)); padding: 0 var(--pad) 10px; scroll-padding-inline: var(--pad); }
    .orbit-vids::-webkit-scrollbar { display: none; }
    .ov { scroll-snap-align: start; } .ov:nth-child(2) { margin-top: 0; }
    .c-logo { font-size: 17px; }
  }
</style>
