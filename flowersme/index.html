<link rel="stylesheet" href="../shared/site.css?v=5">
<style>
  :root {
    --bg: #FFF8F7; --surface: #FFFFFF; --soft: #FDECEC; --ink: #1F2A4D; --muted: #626783;
    --line: #F3DEDF; --line-strong: #E8C6CA; --sale: #1F3263; --ok: #2E8B57;
    --accent: #D7263D; --accent-ink: #FFFFFF; --accent-text: #BF1F34;
    --f-head: 'Lora', Georgia, serif; --f-body: 'Nunito Sans', system-ui, sans-serif; --w-head: 500;
    --r-card: 24px; --r-btn: 40px; --r-img: 28px; --r-big: 34px;
    --hdr-bg: rgba(255,248,247,.9); --demo-bg: #1F3263; --logo-h: 62px;
    --finale-bg: #1F3263; --finale-ink: #FFFFFF; --finale-accent: #F2B544; --finale-btn: #F2B544; --finale-btn-ink: #1F2A4D;
    --card-shadow: 0 34px 60px -38px rgba(31,42,77,.45);
  }
  .pcard { box-shadow: 0 18px 40px -34px rgba(31,42,77,.5); }
  .pbadge-bestseller { background: #F2B544; color: var(--ink); }
  .hdr { padding-top: 8px; padding-bottom: 8px; }

  /* hero: büdcə seçicisi */
  .f-hero { display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(28px, 5vw, 80px); align-items: center; max-width: 1400px; margin: 0 auto;
            padding: clamp(32px, 5vw, 80px) var(--pad) clamp(56px, 8vw, 110px); position: relative; }
  .f-hero h1 { font-size: clamp(50px, 7vw, 104px); line-height: .98; margin: 22px 0 20px; }
  .f-hero h1 em { color: var(--accent-text); }
  .budget-card { margin-top: 30px; background: var(--surface); border-radius: 26px; padding: 24px 26px 22px; box-shadow: 0 30px 60px -40px rgba(31,42,77,.55); border: 1px solid var(--line); max-width: 540px; }
  .budget-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .budget-top span { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; font-weight: 800; color: var(--muted); }
  .budget-top output { font-family: var(--f-head); font-size: 44px; line-height: 1; color: var(--accent-text); font-variant-numeric: lining-nums tabular-nums; }
  .budget-range { width: 100%; margin: 16px 0 6px; appearance: none; height: 8px; border-radius: 8px; outline-offset: 6px;
                  background: linear-gradient(90deg, var(--accent) var(--p, 40%), var(--line-strong) var(--p, 40%)); }
  .budget-range::-webkit-slider-thumb { appearance: none; width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); box-shadow: 0 6px 16px -4px rgba(215,38,61,.6); cursor: grab; }
  .budget-range::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); cursor: grab; }
  .budget-scale { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); font-weight: 700; }
  .budget-res { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
  .thumbs { display: flex; }
  .thumbs img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; margin-left: -12px; box-shadow: 0 6px 12px -6px rgba(0,0,0,.4); }
  .thumbs img:first-child { margin-left: 0; }
  .budget-res p { font-size: 15px; color: var(--muted); flex: 1; } .budget-res b { color: var(--ink); font-size: 17px; display: block; }
  .budget-card .btn { width: 100%; margin-top: 16px; }
  .f-media { position: relative; }
  .f-media img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 300px 300px 300px 36px; box-shadow: 0 50px 90px -50px rgba(31,42,77,.6); }
  .f-media::before { content: ""; position: absolute; width: 150px; height: 150px; border-radius: 50%; background: #F2B544; right: -20px; top: 24px; z-index: -1; }
  .f-media::after { content: ""; position: absolute; width: 72%; height: 72%; border-radius: 50%; background: var(--soft); left: -48px; bottom: -40px; z-index: -1; }
  .f-sticker { position: absolute; left: -10px; top: 46%; background: #1F3263; color: #fff; border-radius: 50%; width: 118px; height: 118px; display: grid; place-items: center; text-align: center;
               font-size: 12.5px; font-weight: 700; line-height: 1.25; transform: rotate(-10deg); box-shadow: 0 20px 40px -20px rgba(31,42,77,.8); }
  .f-sticker b { display: block; font-family: var(--f-head); font-size: 26px; color: #F2B544; font-weight: 500; }

  /* büdcə kartları və çeşidlər */
  .f-budgets { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .f-budgets a { position: relative; isolation: isolate; border-radius: 30px; padding: 40px 36px; min-height: 300px; display: grid; align-content: end; gap: 8px; color: #fff; overflow: hidden; }
  .f-budgets a::before { content: ""; position: absolute; inset: 0; background: var(--img) center/cover; z-index: -2; transition: transform 1s var(--ease); }
  .f-budgets a::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(31,50,99,0) 20%, rgba(31,50,99,.88)); z-index: -1; }
  .f-budgets a:hover::before { transform: scale(1.06); }
  .f-budgets b { font-family: var(--f-head); font-weight: 500; font-size: clamp(40px, 4.6vw, 64px); line-height: 1; font-variant-numeric: lining-nums; }
  .f-budgets span { font-size: 15.5px; opacity: .92; } .f-budgets em { font-style: normal; display: inline-flex; gap: 8px; align-items: center; font-weight: 800; margin-top: 6px; color: #F2B544; }
  .types { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
  .types a { padding: 11px 18px; border-radius: 30px; background: #fff; border: 1px solid var(--line-strong); font-size: 15px; font-weight: 700; transition: all .25s; min-height: 44px; display: inline-flex; align-items: center; }
  .types a:hover { border-color: var(--accent); color: var(--accent-text); }
  @media (max-width: 900px) {
    .f-hero { grid-template-columns: 1fr; } .f-media { order: -1; max-width: 420px; margin: 0 auto; width: 100%; }
    .f-media img { aspect-ratio: 1; } .f-sticker { width: 96px; height: 96px; font-size: 11px; left: 0; top: auto; bottom: 10px; } .f-sticker b { font-size: 21px; }
    .f-budgets { grid-template-columns: 1fr; } .f-budgets a { min-height: 220px; }
  }
</style>
</head>
<body>
<noscript>Bu sayt JavaScript tələb edir.</noscript>
<script>
window.SITE = {
  key: 'fme-', name: 'Flowersme.az', tagline: 'Gül salonu, buket satışı',
  logo: 'img/logo.png', logoW: 140, logoH: 121,
  instagram: 'flowersme.az', whatsapp: '994708832828', phones: ['+994 70 883 28 28', '+994 70 553 57 00'],
  address: 'Füzuli küç. 79, 28 Mall yanı, Bakı', mapQuery: 'Füzuli 79, 28 Mall, Baku',
  hours: 'Sifariş: WhatsApp və zəng ilə', hoursShort: 'Onlayn ödəniş və Bakı daxili çatdırılma',
  deliveryLine: 'Bakı daxili çatdırılma, 100 ₼-dən pulsuz', footerLine: '28 Mall yanında gül salonu. Hər büdcəyə təzə buketlər, sevgi ilə yığılır.',
  freeDeliveryFrom: 100, deliveryFee: 7, priceMax: 250, slotFrom: 9, slotTo: 23,
  sizes: [{ id: 'std', label: 'Standart', k: 1, note: 'Şəkildəki kimi' }, { id: 'big', label: 'Böyük', k: 1.25, note: 'Daha çox gül' }, { id: 'lux', label: 'Lüks', k: 1.5, note: 'Fiyonk və şarla' }],
  categories: [
    { id: 'qizilgul', label: 'Qızılgül' },
    { id: 'qarisiq', label: 'Qarışıq buketlər' },
    { id: 'gelin', label: 'Gəlin gülü' },
  ],
  colors: [
    { id: 'cehrayi', label: 'Çəhrayı', hex: '#F2A2B5' }, { id: 'qirmizi', label: 'Qırmızı', hex: '#C81E35' }, { id: 'ag', label: 'Ağ və krem', hex: '#F5EFE3' },
  ],
  products: [
    { id: 'boyuk-fiyonklu', name: 'Böyük fiyonklu buket', cats: ['qarisiq'], colors: ['cehrayi'], price: 165, badge: 'Bestseller', featured: true, image: 'img/p11.jpg',
      desc: 'Çəhrayı güllər və hortenziya, iri çəhrayı fiyonkla. “Me Flowers” imzalı qablaşdırma.' },
    { id: 'qirmizi-ag-fiyonk', name: 'Qırmızı qızılgül, ağ fiyonk', cats: ['qizilgul'], colors: ['qirmizi', 'ag'], price: 120, featured: true, image: 'img/p12.jpg',
      desc: 'Klassik qırmızı qızılgüllər, ağ qablaşdırma və iri ağ fiyonk.' },
    { id: 'ag-gipsofila', name: 'Ağ qızılgül və gipsofila', cats: ['gelin', 'qizilgul'], colors: ['ag'], price: 95, badge: 'Yeni', featured: true, image: 'img/p4.jpg',
      desc: 'Krem qızılgüllər və gipsofila buludu. Gəlin buketi kimi də sifariş olunur.' },
    { id: 'cehrayi-bulud', name: 'Çəhrayı bulud buketi', cats: ['qarisiq'], colors: ['cehrayi'], price: 250, badge: 'Lüks', featured: true, image: 'img/p10.jpg',
      desc: 'Böyük ölçülü, pion qızılgül, hortenziya və orxideyalı çəhrayı buket.' },
    { id: 'fusya-qarisiq', name: 'Fuşya qarışıq buket', cats: ['qarisiq'], colors: ['cehrayi'], price: 85, image: 'img/p1.jpg',
      desc: 'Fuşya kol qızılgülləri, krem ranunkuluslar və gipsofila.' },
    { id: 'lilyali', name: 'Lilyalı çəhrayı buket', cats: ['qarisiq'], colors: ['cehrayi', 'ag'], price: 110, image: 'img/p6.jpg',
      desc: 'Ətirli lilyalar, hortenziya və çəhrayı güllər.' },
    { id: 'qirmizi-me-lent', name: 'Qırmızı qızılgül, Me lentli', cats: ['qizilgul'], colors: ['qirmizi'], price: 135, image: 'img/p7.jpg',
      desc: 'Qırmızı qızılgüllər və çəhrayı gipsofila, imzalı lentlə bağlanıb.' },
    { id: 'pastel-xrizantema', name: 'Pastel xrizantema buketi', cats: ['qarisiq'], colors: ['cehrayi', 'ag'], price: 65, image: 'img/p3.jpg',
      desc: 'Çəhrayı və ağ xrizantemalar, yumşaq pastel tonlarda.' },
    { id: 'hortenziyali', name: 'Hortenziyalı buket', cats: ['qarisiq'], colors: ['cehrayi'], price: 125, image: 'img/p8.jpg',
      desc: 'Çəhrayı hortenziya və güllər, lentli qablaşdırmada.' },
    { id: 'kol-qizilgul', name: 'Çəhrayı kol qızılgül', cats: ['qizilgul'], colors: ['cehrayi'], price: 75, old: 90, badge: 'Endirim', image: 'img/p2.jpg',
      desc: 'Onlarla çəhrayı kol qızılgülü və gipsofila.' },
    { id: 'urekli-pastel', name: 'Ürəkli pastel buket', cats: ['qarisiq'], colors: ['cehrayi', 'ag'], price: 70, image: 'img/p5.jpg',
      desc: 'Pastel güllər və ürək formalı bəzəklər.' },
    { id: 'pion-qizilgul', name: 'Pion qızılgüllü buket', cats: ['qarisiq', 'qizilgul'], colors: ['cehrayi'], price: 145, image: 'img/p9.jpg',
      desc: 'Pion formalı qızılgüllər və gipsofila, imzalı lentlə.' },
  ],
  featuredTitle: 'Bu həftənin <em>buketləri</em>',
  perks: [
    { icon: 'truck', title: 'Bakı daxili çatdırılma', text: '100 ₼-dən pulsuz' },
    { icon: 'card', title: 'Onlayn ödəniş', text: 'Kartla, bir neçə saniyəyə' },
    { icon: 'gift', title: 'Şar əlavə edin', text: '@helium_az ilə birlikdə' },
    { icon: 'pin', title: '28 Mall yanı', text: 'Füzuli küç. 79' },
  ],
  heroHtml: (I) => `
    <section class="f-hero">
      <div>
        <p class="eyebrow">28 Mall yanı · Bakı</p>
        <h1>Sevgini<br><em>buketlə deyin</em></h1>
        <p class="lead">Qızılgüldən tülpana, kiçik jestdən böyük sürprizə qədər. Büdcənizi seçin, uyğun buketləri dərhal görün.</p>
        <div class="budget-card" id="budget">
          <div class="budget-top"><span>Büdcəniz</span><output id="bVal">120 ₼</output></div>
          <input class="budget-range" id="bRange" type="range" min="50" max="250" step="5" value="120" aria-label="Büdcə, manatla">
          <div class="budget-scale"><span>50 ₼</span><span>150 ₼</span><span>250 ₼</span></div>
          <div class="budget-res"><div class="thumbs" id="bThumbs"></div><p><b id="bCount"></b>bu büdcəyə uyğun buket</p></div>
          <a class="btn btn-lg" id="bGo" href="#/magaza">Buketləri göstər ${I.arrow}</a>
        </div>
      </div>
      <div class="f-media"><img src="img/hero.jpg" alt="Çəhrayı fiyonklu böyük çəhrayı buket" width="640" height="800" fetchpriority="high">
        <div class="f-sticker"><span><b>Me</b>Flowers<br>imzası</span></div></div>
    </section>`,
  signatureHtml: (I, wa) => `
    <section class="sec sig">
      <div class="sec-head"><p class="eyebrow">Büdcəyə görə</p><h2>Hər büdcəyə <em>gözəl buket</em></h2></div>
      <div class="f-budgets">
        <a href="#/magaza?max=100" style="--img:url(img/p5.jpg)"><span>Gündəlik sevinc</span><b>50 – 100 ₼</b><em>Buketlərə bax ${I.arrow}</em></a>
        <a href="#/magaza?min=100" style="--img:url(img/p10.jpg)"><span>Xüsusi an üçün</span><b>100 – 250 ₼</b><em>Buketlərə bax ${I.arrow}</em></a>
      </div>
      <div class="types">${['Tülpan', 'Papatya', 'Kompozisiya', 'Çanta mix', 'Ekonom buketlər', 'Dipçəklər', 'Gəlin gülü'].map((t) => `<a href="${wa('Salam! ' + t + ' ilə maraqlanıram.')}" target="_blank" rel="noopener">${t}</a>`).join('')}</div>
    </section>`,
  onHome: (root, { P }) => {
    const r = root.querySelector('#bRange'), out = root.querySelector('#bVal'), th = root.querySelector('#bThumbs'), cnt = root.querySelector('#bCount'), go = root.querySelector('#bGo');
    const upd = () => {
      const v = +r.value, list = P.filter((p) => p.price <= v).sort((a, b) => b.price - a.price);
      out.textContent = `${v} ₼`; r.style.setProperty('--p', ((v - 50) / 200) * 100 + '%');
      cnt.textContent = list.length ? `${list.length} buket` : 'Hələ yoxdur,';
      th.innerHTML = list.slice(0, 4).map((p) => `<img src="${p.image}" alt="" width="46" height="46">`).join('');
      go.href = `#/magaza?max=${v}`;
    };
    r.addEventListener('input', upd); upd();
  },
  about: {
    title: 'Təzə güllər,<br><em>sevgi ilə</em> yığılır',
    paragraphs: [
      'Flowersme 28 Mall yanında, Füzuli küçəsində gül salonudur. Hər gün təzə güllərdən buketlər yığırıq və Bakı daxilində çatdırırıq.',
      'Buketə şar əlavə etmək istəyirsiniz? @helium_az ilə birlikdə işləyirik.',
    ],
    images: ['img/p9.jpg', 'img/p12.jpg'],
  },
  finaleTitle: 'Buketinizi <em>indi</em> sifariş edin',
};
</script>
<script src="../shared/site.js?v=5"></script>
</body>
</html>
