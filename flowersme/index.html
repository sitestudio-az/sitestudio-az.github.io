<style>
  :root {
    --bg: #FFF7F6; --surface: #FFFFFF; --soft: #FCE9EA; --ink: #1F2A4D; --muted: #6A6F87;
    --line: #F3DCDE; --line-strong: #EBC6CA;
    --brand: #D7263D; --brand-ink: #FFFFFF; --brand-text: #C21F35;
    --f-head: 'Lora', Georgia, serif; --f-body: 'Nunito Sans', system-ui, sans-serif; --w-head: 500;
    --r-hero: 220px 220px 220px 24px; --r-card: 26px; --r-btn: 40px;
    --hdr-bg: rgba(255,247,246,.9); --demo-bg: #1F3263;
    --contact-bg: #1F3263; --contact-ink: #FFFFFF; --contact-accent: #F2B544;
  }
  .lg { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; flex: none; background: #FFF0F0; box-shadow: 0 0 0 1px var(--line-strong); }
  .lg img { width: 100%; height: 100%; object-fit: cover; transform: scale(2.1); transform-origin: 50% 24%; }
  .wm { font-family: 'Great Vibes', cursive; font-size: 36px; line-height: 1; color: var(--ink); }
  .wm i { font-family: 'Nunito Sans', sans-serif; font-style: normal; font-size: 14px; font-weight: 700; color: var(--brand); letter-spacing: .04em; }
  h1 em, h2 em { font-family: 'Lora', serif; }
  .hero { position: relative; }
  .hero-media::after { content: ""; position: absolute; width: 140px; height: 140px; border-radius: 50%; background: #F2B544; right: -18px; top: 30px; z-index: -1; opacity: .9; }
  .hero-media::before { content: ""; position: absolute; width: 70%; height: 70%; border-radius: 50%; background: var(--soft); left: -40px; bottom: -40px; z-index: -1; }
  .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .card { box-shadow: 0 20px 40px -32px rgba(31,42,77,.45); border-color: transparent; }
  .card-tag { background: #F2B544; color: var(--ink); }
  .budget { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .budget a { position: relative; border-radius: 28px; padding: 38px 34px; overflow: hidden; display: grid; gap: 10px; min-height: 230px; align-content: end; color: #fff; transition: transform .3s; }
  .budget a:hover { transform: translateY(-4px); }
  .budget a::before { content: ""; position: absolute; inset: 0; background: var(--img) center/cover; z-index: -2; transition: transform .6s; }
  .budget a::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(31,50,99,.05), rgba(31,50,99,.85)); z-index: -1; }
  .budget a:hover::before { transform: scale(1.05); }
  .budget b { font-family: 'Lora', serif; font-size: clamp(34px, 4vw, 52px); font-weight: 500; line-height: 1; }
  .budget span { font-size: 15px; opacity: .9; }
  .types { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .types a { padding: 10px 18px; border-radius: 30px; background: #fff; border: 1px solid var(--line-strong); font-size: 15px; font-weight: 600; transition: all .2s; }
  .types a:hover { border-color: var(--brand); color: var(--brand); }
  @media (max-width: 700px) { .budget { grid-template-columns: 1fr; } .budget a { min-height: 180px; } }
</style>
</head>
